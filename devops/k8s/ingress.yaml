apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glowdesk-ingress
  namespace: glowdesk-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: app.glowdesk.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: glowdesk-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glowdesk-frontend
                port:
                  number: 3000
