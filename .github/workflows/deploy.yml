name: GlowDesk Automatic CD (Continuous Deployment) Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy-to-vps:
    name: Automatic Deploy to Live VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.0
        if: ${{ secrets.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd GlowDesk || git clone https://github.com/your-username/GlowDesk.git && cd GlowDesk
            git pull origin main
            docker compose up -d --build --remove-orphans
            echo "🎉 GlowDesk Live VPS Deployment Complete!"
