name: glowdesk

services:
  # 1. Reverse Proxy (Nginx)
  proxy:
    image: nginx:alpine
    container_name: glowdesk_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - minio
      - phpmyadmin
      - dozzle

  # 2. Frontend (Next.js App Router)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glowdesk_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"

  # 3. Core API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowdesk_backend
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=glowdesk_secret
      - DB_NAME=glowdesk
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=glowdesk-uploads
      - JWT_SECRET=super-secret-key-change-in-production-glowdesk
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Async Worker (Celery Worker)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowdesk_celery_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: always
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=glowdesk_secret
      - DB_NAME=glowdesk
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - JWT_SECRET=super-secret-key-change-in-production-glowdesk
    depends_on:
      - backend
      - redis

  # 4b. Task Scheduler (Celery Beat) - Madde 31
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowdesk_celery_beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - celery_worker
      - redis

  # 4c. Task Monitoring (Celery Flower) - Madde 30
  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowdesk_celery_flower
    command: celery -A app.worker.celery_app flower --port=5555
    restart: always
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - celery_worker
      - redis

  # 5. Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: glowdesk_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: glowdesk_secret
      MYSQL_DATABASE: glowdesk
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./devops/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pglowdesk_secret"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Database GUI (PhpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: glowdesk_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  # 7. Cache & Task Queue (Redis)
  redis:
    image: redis:7-alpine
    container_name: glowdesk_redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./devops/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - "6379:6379"

  # 8. S3 Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: glowdesk_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 9. Log Monitoring (Dozzle)
  dozzle:
    image: amir20/dozzle:latest
    container_name: glowdesk_dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"

  # 10. Remote Web Docker Management & Terminal (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: glowdesk_portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9002:9000"
      - "9443:9443"

  # 11. WireGuard Web VPN (WG-Easy)
  vpn:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: glowdesk_vpn
    restart: always
    environment:
      - WG_HOST=${VPS_IP:-51.195.110.85}
      - PASSWORD_HASH=$$2b$$12$$R.Sg0o58B5gJv3bJz.y3ce/QGZJkYvVqL.yQ93jB5y1.83Y6f8q2S
      - PORT=51821
      - WG_PORT=51820
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    volumes:
      - etc_wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

volumes:
  mysql_data:
  redis_data:
  minio_data:
  portainer_data:
  etc_wireguard:
